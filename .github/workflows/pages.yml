# Rebuild the Atlas site (src/atlas.py) from committed artefacts and publish it to Pages.
#
# CI deliberately does not re-run the study. run_all.sh needs days of archive
# downloads and would make every deploy a fresh experiment whose numbers could
# drift from the ones that were reviewed. Instead the analysis outputs -
# data/processed/*.parquet, data/raw/capital_coverage.json and figures/*.png -
# are committed, and this workflow only re-renders the page around them. A
# change to the copy or the CSS therefore cannot move a published statistic.
#
# Re-running the analysis stays a deliberate, local act: `./run_all.sh`, then
# commit the changed artefacts and review the diff like any other change.

name: Deploy report to Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/processed/**'
      - 'data/raw/**'
      - 'figures/**'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install dependencies
        run: pip install -r requirements-site.txt

      - name: Install Chromium for verification
        run: python -m playwright install --with-deps chromium

      - name: Fail early if an analysis artefact is missing
        # Without this the build dies deep inside pandas with a stack trace
        # about a missing column. Naming the actual missing file is the
        # difference between a five second fix and a confused afternoon.
        run: |
          missing=0
          for f in data/processed/cities_metrics.parquet \
                   data/processed/cities_pop.parquet \
                   data/processed/decision_value_curves.parquet \
                   data/processed/country_coverage.parquet \
                   data/processed/country_capitals.csv \
                   data/processed/stars.parquet \
                   data/processed/significance_headline.parquet \
                   data/raw/capital_coverage.json \
                   data/raw/city_coverage.json; do
            if [ ! -f "$f" ]; then echo "missing artefact: $f"; missing=1; fi
          done
          test "$missing" -eq 0

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the Atlas site
        # The base path and the public origin come from the Pages settings, so
        # the custom domain (bogdan.nimblex.net) lands in every canonical URL,
        # Open Graph tag and sitemap entry rather than the github.io alias.
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          cd src
          python atlas.py --base "${BASE_PATH}/" --origin "${BASE_URL%"$BASE_PATH"}"

      - name: Verify in a browser at the published base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: cd src && python check_atlas.py --base "${BASE_PATH}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
